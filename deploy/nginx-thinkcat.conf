# Thinkcat Labs Nginx example.
# Replace "_" in server_name with the real domain before enabling this file.
# Debian/Ubuntu:
#   sudo cp nginx-thinkcat.conf /etc/nginx/sites-available/thinkcat-labs.conf
#   sudo ln -s /etc/nginx/sites-available/thinkcat-labs.conf /etc/nginx/sites-enabled/thinkcat-labs.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/thinkcat-labs/current;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~* \.html$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
