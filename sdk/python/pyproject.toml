[build-system]
requires = ["setuptools>=63"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkcat"
version = "0.1.1"
description = "Python client for the Thinkcat tabular prediction API"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["thinkcat", "thinkcat_client"]

[tool.setuptools.package-data]
thinkcat = ["donation.json"]
